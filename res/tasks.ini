desc  = Stage 2: install Microsoft's WSL MSI only after the separate prerequisites task and any required restart. Refuses pending component-servicing restarts. Requires build 19041+ and virtualization for WSL 2. Installs no Linux distribution and never initiates a restart.
cmd   = "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; if ([int](Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuildNumber -lt 19041) { throw 'This WSL installation requires Windows build 19041 or newer.' }; foreach ($name in @('Microsoft-Windows-Subsystem-Linux','VirtualMachinePlatform')) { $state=(Get-WindowsOptionalFeature -Online -FeatureName $name).State; if ($state -ne 'Enabled') { throw ('WSL prerequisite not active: '+$name+' ('+$state+'). Run Enable WSL prerequisites, restart Windows, then retry this install.') } }; if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending') { throw 'Windows component servicing requires a restart before this WSL installation. Restart manually and retry.' }; $wg=Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\winget.exe'; if (-not (Test-Path -LiteralPath $wg -PathType Leaf)) { $wg=(Get-Command winget.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1).Source }; if (-not $wg) { $pkg=Get-AppxPackage -AllUsers Microsoft.DesktopAppInstaller -ErrorAction SilentlyContinue | Where-Object InstallLocation | Sort-Object { [version]$_.Version } -Descending | Select-Object -First 1; if ($pkg) { $wg=Join-Path $pkg.InstallLocation 'winget.exe' } }; if (-not $wg -or -not (Test-Path -LiteralPath $wg -PathType Leaf)) { throw 'WinGet is not installed. Run the bootstrap task first.' }; & $wg install --id Microsoft.WSL --exact --source winget --installer-type wix --silent --disable-interactivity --accept-source-agreements --accept-package-agreements --override '/qn /norestart REBOOT=ReallySuppress'; $code=$LASTEXITCODE; if ($code -eq 3010) { Write-Output 'Installation succeeded; restart required (3010).'; exit 0 }; exit $code"

# ---------------------- Minimal Windows preferences --------------------
# Deliberately omitted: forced Edge removal, service/scheduled-task disabling,
# broad AppX removal, disabling antivirus, and speculative performance tweaks.
# Defender sample submission is a separate advanced privacy trade-off, not hardening.

[Development | Enable Win32 long paths]
param = check:0
tags  = settings, dev, win10, win11, reboot
desc  = Enables the Windows long-path policy. Applications must support long paths too; existing processes may cache the old value.
cmd   = "%SystemRoot%\System32\reg.exe" add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

[Development | Enable Developer Mode]
param = check:0
tags  = settings, dev, win10, win11
desc  = Enables development/sideloading policy for this machine. Does not enable Device Portal, remote discovery, or remote access.
cmd   = "%SystemRoot%\System32\reg.exe" add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f

[Privacy | Minimize diagnostic data and disable feedback prompts]
param = check:0
tags  = settings, privacy, win10, win11
desc  = Sets AllowTelemetry=0 on Enterprise/Education/IoT/Server editions and 1 on other editions, plus DoNotShowFeedbackNotifications=1. Does not disable security services, updates, or other apps' diagnostics.
cmd   = "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $edition=(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').EditionID; $level=1; if ($edition -match 'Enterprise|Education|IoT|Server') { $level=0 }; $p='HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'; if (-not (Test-Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name AllowTelemetry -PropertyType DWord -Value $level -Force | Out-Null; New-ItemProperty -Path $p -Name DoNotShowFeedbackNotifications -PropertyType DWord -Value 1 -Force | Out-Null; Write-Output ('Diagnostic data policy level: '+$level+'; edition: '+$edition)"

[Privacy | Disable advertising ID, tailored experiences, and Activity History]
param = check:0
tags  = settings, privacy, win10, win11
desc  = Disables current-user advertising ID and tailored diagnostic experiences, and machine policies for Activity Feed collection/publication/upload. Does not delete existing cloud data.
cmd   = "%SystemRoot%\System32\reg.exe" add "HKCU\Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo" /v Enabled /t REG_DWORD /d 0 /f && "%SystemRoot%\System32\reg.exe" add "HKCU\Software\Microsoft\Windows\CurrentVersion\Privacy" /v TailoredExperiencesWithDiagnosticDataEnabled /t REG_DWORD /d 0 /f && "%SystemRoot%\System32\reg.exe" add "HKLM\SOFTWARE\Policies\Microsoft\Windows\System" /v EnableActivityFeed /t REG_DWORD /d 0 /f && "%SystemRoot%\System32\reg.exe" add "HKLM\SOFTWARE\Policies\Microsoft\Windows\System" /v PublishUserActivities /t REG_DWORD /d 0 /f && "%SystemRoot%\System32\reg.exe" add "HKLM\SOFTWARE\Policies\Microsoft\Windows\System" /v UploadUserActivities /t REG_DWORD /d 0 /f

[Privacy | Disable Bing web suggestions in Start and Search]
param = check:0
tags  = settings, privacy, search, win10, win11, restart-explorer
desc  = Disables online search-box suggestions and applies Windows web-search policies. Exact behavior depends on Windows build and edition; local file/app search remains available.
cmd   = "%SystemRoot%\System32\reg.exe" add "HKCU\Software\Policies\Microsoft\Windows\Explorer" /v DisableSearchBoxSuggestions /t REG_DWORD /d 1 /f && "%SystemRoot%\System32\reg.exe" add "HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search" /v DisableWebSearch /t REG_DWORD /d 1 /f && "%SystemRoot%\System32\reg.exe" add "HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search" /v ConnectedSearchUseWeb /t REG_DWORD /d 0 /f

[Privacy | Tame Microsoft Edge]
param = check:0
tags  = settings, privacy, edge, win10, win11
desc  = Disables Edge Startup Boost, background mode, first-run experience, recommendations, personalization reporting, and required/optional browser diagnostic data through DiagnosticData=0 (Edge 122+ on Windows). Keeps Edge, WebView2, and their security updates. Restart Edge afterward.
cmd   = "%SystemRoot%\System32\reg.exe" add "HKLM\SOFTWARE\Policies\Microsoft\Edge" /v StartupBoostEnabled /t REG_DWORD /d 0 /f && "%SystemRoot%\System32\reg.exe" add "HKLM\SOFTWARE\Policies\Microsoft\Edge" /v BackgroundModeEnabled /t REG_DWORD /d 0 /f && "%SystemRoot%\System32\reg.exe" add "HKLM\SOFTWARE\Policies\Microsoft\Edge" /v HideFirstRunExperience /t REG_DWORD /d 1 /f && "%SystemRoot%\System32\reg.exe" add "HKLM\SOFTWARE\Policies\Microsoft\Edge" /v ShowRecommendationsEnabled /t REG_DWORD /d 0 /f && "%SystemRoot%\System32\reg.exe" add "HKLM\SOFTWARE\Policies\Microsoft\Edge" /v PersonalizationReportingEnabled /t REG_DWORD /d 0 /f && "%SystemRoot%\System32\reg.exe" add "HKLM\SOFTWARE\Policies\Microsoft\Edge" /v DiagnosticData /t REG_DWORD /d 0 /f

[Security | Enable Defender potentially unwanted app blocking]
param = check:0
tags  = settings, security, defender, win10, win11
desc  = Enables Microsoft Defender PUA blocking for adware/bundleware. Verifies the resulting preference; management policy or Tamper Protection may prevent changes. Does not disable antivirus or modify exclusions.
cmd   = "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; Set-MpPreference -PUAProtection Enabled -Force; if ([int](Get-MpPreference).PUAProtection -ne 1) { throw 'Defender PUA blocking was not enabled. Check management policy and Tamper Protection.' }; Write-Output 'Defender potentially unwanted app blocking is enabled.'"

[Privacy | Disable Defender sample submission (reduces protection)]
param = check:0
tags  = settings, privacy, advanced, defender, win10, win11
desc  = ADVANCED PRIVACY TRADE-OFF: sets SubmitSamplesConsent=NeverSend. This disables Block at First Sight and reduces cloud-assisted protection; it is NOT a hardening task. Detection metadata can still be sent. Does not disable local antivirus scanning.
cmd   = "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; Write-Warning 'NeverSend disables Block at First Sight and reduces cloud-assisted protection.'; Set-MpPreference -SubmitSamplesConsent NeverSend -Force; if ([int](Get-MpPreference).SubmitSamplesConsent -ne 2) { throw 'Defender sample submission was not changed. Check management policy and Tamper Protection.' }; Write-Output 'Automatic Defender file sample submission is disabled; detection metadata can still be sent.'"

