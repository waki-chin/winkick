# WinKick task catalog - Windows 10/11 x64, including IoT Enterprise/LTSC.
# Intended for an administrator configuring their own signed-in account.
# All tasks are opt-in. --all selects the ENTIRE catalog, including every app.
# Package managers come first; later installs fail normally if WinGet is unavailable.
# App installs use exact community-source IDs, not the msstore source.
# Resolve WinGet via the current user's App Execution Alias, then PATH, then the
# newest all-users App Installer package. A missing executable gets a clear error.
# No external helper scripts are required; commands must remain on ONE line.
# PowerShell errors and native installer exit codes are propagated to WinKick.
# Completed MSI/bootstrapper installations returning 3010 are normalized to success
# in reboot-tagged tasks; other errors remain failures. The runner is unchanged.
# Installer agreements are accepted for applications the operator selects.
# No task directly requests a reboot. Tags may trigger WinKick's end-of-run prompt
# or Explorer restart; use --no-reboot / --no-explorer-restart to suppress those.
# The executable embeds this catalog at build time; changing this file needs a rebuild.
# To load this working copy directly: build\winkick.exe --config res\tasks.ini

# ------------------------- Package management -------------------------

[Package management | Bootstrap or repair WinGet and update community source]
param = check:0
tags  = packages, winget, net, win10, win11
desc  = Installs Microsoft's WinGet PowerShell module and repairs the latest stable WinGet with its App Installer dependencies, including Store-less IoT/LTSC. Updates only the winget community source afterward.
# source update does not accept --accept-source-agreements; install tasks do.
cmd   = "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; [Net.ServicePointManager]::SecurityProtocol=[Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12; Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope AllUsers -Force | Out-Null; Install-Module -Name Microsoft.WinGet.Client -Repository PSGallery -Scope AllUsers -Force -AllowClobber -Confirm:$false; Import-Module Microsoft.WinGet.Client; Repair-WinGetPackageManager -AllUsers -Latest -Force; $wg=Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\winget.exe'; if (-not (Test-Path -LiteralPath $wg -PathType Leaf)) { $wg=(Get-Command winget.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1).Source }; if (-not $wg) { $pkg=Get-AppxPackage -AllUsers Microsoft.DesktopAppInstaller -ErrorAction SilentlyContinue | Where-Object InstallLocation | Sort-Object { [version]$_.Version } -Descending | Select-Object -First 1; if ($pkg) { $wg=Join-Path $pkg.InstallLocation 'winget.exe' } }; if (-not $wg -or -not (Test-Path -LiteralPath $wg -PathType Leaf)) { throw 'WinGet is not installed. Run the bootstrap task first.' }; & $wg source update --name winget --disable-interactivity; exit $LASTEXITCODE"

[Package management | Remove the msstore source from WinGet]
param = check:0
tags  = packages, winget, win10, win11
desc  = Removes only WinGet's msstore package source; does not uninstall Microsoft Store. WinGet reports its normal result if the source is already absent.
cmd   = "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $wg=Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\winget.exe'; if (-not (Test-Path -LiteralPath $wg -PathType Leaf)) { $wg=(Get-Command winget.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1).Source }; if (-not $wg) { $pkg=Get-AppxPackage -AllUsers Microsoft.DesktopAppInstaller -ErrorAction SilentlyContinue | Where-Object InstallLocation | Sort-Object { [version]$_.Version } -Descending | Select-Object -First 1; if ($pkg) { $wg=Join-Path $pkg.InstallLocation 'winget.exe' } }; if (-not $wg -or -not (Test-Path -LiteralPath $wg -PathType Leaf)) { throw 'WinGet is not installed. Run the bootstrap task first.' }; & $wg source remove --name msstore --disable-interactivity; exit $LASTEXITCODE"

[Package management | Install Scoop]
param = check:0
tags  = packages, scoop, net, win10, win11
desc  = Runs Scoop's official HTTPS installer for the current account, using its explicit administrator-install option. Execution-policy bypass applies only to this PowerShell process.
cmd   = "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; [Net.ServicePointManager]::SecurityProtocol=[Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12; & ([scriptblock]::Create((Invoke-RestMethod -Uri 'https://get.scoop.sh'))) -RunAsAdmin; if ($LASTEXITCODE) { exit $LASTEXITCODE }"

[Package management | Install Chocolatey]
param = check:0
tags  = packages, chocolatey, net, win10, win11
desc  = Runs Chocolatey's official community HTTPS installer. Does not install any additional application choices or change the machine-wide PowerShell execution policy.
cmd   = "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; [Net.ServicePointManager]::SecurityProtocol=[Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12; Invoke-Expression ((New-Object Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1')); if ($LASTEXITCODE) { exit $LASTEXITCODE }"

# ------------------------- Windows features ---------------------------
# WSL is deliberately two-stage. On a fresh machine, enable prerequisites,
# restart manually when required, then select the WSL application install.
# Selecting --all cannot bypass the install task's pending-restart checks.

[Windows features | Enable WSL prerequisites (stage 1)]
param = check:0
tags  = features, dev, wsl, win10, win11, reboot
desc  = Enables Windows Subsystem for Linux and Virtual Machine Platform with -NoRestart. Does not install WSL or a Linux distribution. If a restart is required, restart manually before running the separate WSL installation task.
cmd   = "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; if ([int](Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuildNumber -lt 19041) { throw 'These WSL prerequisites require Windows build 19041 or newer.' }; $restart=$false; foreach ($name in @('Microsoft-Windows-Subsystem-Linux','VirtualMachinePlatform')) { $feature=Get-WindowsOptionalFeature -Online -FeatureName $name; if ($feature.State -eq 'EnablePending') { $restart=$true; continue }; if ($feature.State -ne 'Enabled') { $result=Enable-WindowsOptionalFeature -Online -FeatureName $name -All -NoRestart; if ($result.RestartNeeded) { $restart=$true } } }; if ($restart) { Write-Output 'WSL prerequisites are staged. Restart Windows manually, then run the WSL application installation.' } else { Write-Output 'WSL prerequisites are enabled. The separate WSL installation task can now be selected unless component servicing still requires a restart.' }"

