[Input | Disable Sticky, Filter, and Toggle Keys hotkey traps]
param = check:0
tags  = settings, input, keyboard, win10, win11
desc  = Disables activation shortcuts and confirmation prompts for Sticky Keys, Filter Keys, and Toggle Keys. Reads and preserves their other flags/settings, including whether an accessibility feature is currently enabled.
cmd   = "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $dll=[char]34+'user32.dll'+[char]34; Add-Type -MemberDefinition ('[DllImport('+$dll+',SetLastError=true)] public static extern bool SystemParametersInfo(uint action,uint param,IntPtr value,uint flags);') -Name AccessibilityKeys -Namespace WinKick; foreach ($spec in @(@(0x003A,0x003B,8),@(0x0032,0x0033,24),@(0x0034,0x0035,8))) { $mem=[Runtime.InteropServices.Marshal]::AllocHGlobal($spec[2]); try { [Runtime.InteropServices.Marshal]::WriteInt32($mem,$spec[2]); if (-not [WinKick.AccessibilityKeys]::SystemParametersInfo($spec[0],$spec[2],$mem,0)) { throw 'Could not read accessibility keyboard settings.' }; $flags=[Runtime.InteropServices.Marshal]::ReadInt32($mem,4); [Runtime.InteropServices.Marshal]::WriteInt32($mem,4,($flags -band (-bnot 12))); if (-not [WinKick.AccessibilityKeys]::SystemParametersInfo($spec[1],$spec[2],$mem,3)) { throw 'Could not save accessibility keyboard settings.' } } finally { [Runtime.InteropServices.Marshal]::FreeHGlobal($mem) } }"

