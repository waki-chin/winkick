[Explorer | Restore classic right-click context menu]
param = check:0
tags  = settings, explorer, advanced, win11, restart-explorer
desc  = Applies the legacy Windows 11 classic context-menu registry workaround for the current user. Unsupported/newer builds may ignore it; no Windows binaries are patched. Restart Explorer or sign out to refresh the shell.
