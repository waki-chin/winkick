[Windows Update | Set active hours to reduce restart interruptions]
param = check:0
tags  = settings, updates, win10, win11
desc  = Configures a daily active-hours window (maximum 18 hours) during which Windows Update normally avoids automatic restarts. Does not disable updates, force scheduled installations, or guarantee no restart after enforced deadlines.
arg.StartHour = num:8
arg.EndHour = num:23
cmd   = "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; [int]$start='{StartHour}'; [int]$end='{EndHour}'; if ($start -lt 0 -or $start -gt 23 -or $end -lt 0 -or $end -gt 23) { throw 'Active hours must be 0-23.' }; $span=($end-$start+24) % 24; if ($span -eq 0 -or $span -gt 18) { throw 'The active-hours window must be 1-18 hours.' }; $p='HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'; if (-not (Test-Path $p)) { New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name SetActiveHours -PropertyType DWord -Value 1 -Force | Out-Null; New-ItemProperty -Path $p -Name ActiveHoursStart -PropertyType DWord -Value $start -Force | Out-Null; New-ItemProperty -Path $p -Name ActiveHoursEnd -PropertyType DWord -Value $end -Force | Out-Null"
