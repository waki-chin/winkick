# WinKick test configuration. Every command here is harmless: echo / ver / ping only.
# Used by tests/run_tests.ps1.

[General | Echo Greeting]
param = check:1
tags  = common
desc  = Prints a fixed greeting. Harmless.
cmd   = echo hello-winkick-test

[General | Verbose Version]
param = check:1
tags  = common, win11
desc  = Prints Windows version (win11 guard). Harmless.
cmd   = ver

[Failure | Intentional Failure]
param = check:0
tags  = failure-demo
desc  = Always exits with code 7. Failure-scenario test. Must not run by default.
cmd   = exit 7

[Progress | Spinner Simulation]
param = check:0
tags  = common, dev
desc  = Emits CR-separated progress frames; tests log normalization.
cmd   = powershell -NoProfile -NoLogo -EncodedCommand WwBDAG8AbgBzAG8AbABlAF0AOgA6AE8AdQB0AC4AVwByAGkAdABlACgAIgBwAHIAbwBnAHIAZQBzAHMAOgAgADEAMAAlAGAAcgBwAHIAbwBnAHIAZQBzAHMAOgAgADUAMAAlAGAAcgBwAHIAbwBnAHIAZQBzAHMAOgAgADEAMAAwACUAIABkAG8AbgBlAGAAcgBgAG4AIgApAA==

[Network | Net Guard Demo]
param = check:0
tags  = net
desc  = net-tagged item; skipped when offline. Harmless ping.
cmd   = ping -n 1 raw.githubusercontent.com

[OSGuard | Windows 7 Only]
param = check:0
tags  = win7
desc  = win7 guard; mismatch on Windows 10/11. Harmless echo.
cmd   = echo this-should-never-run-here

[OSGuard | Windows 11 Only]
param = check:0
tags  = win11
desc  = win11 guard; runs on Windows 11. Harmless echo.
cmd   = echo running-on-windows-11

[Group | Radio A]
param = check:1
tags  = group:radio
desc  = Mutual exclusion demo A (check:1, file order first) wins.
cmd   = echo radio-a

[Group | Radio B]
param = check:1
tags  = group:radio
desc  = Mutual exclusion demo B loses on initial parse.
cmd   = echo radio-b

[Group | Radio C]
param = check:0
tags  = group:radio
desc  = Mutual exclusion demo C.
cmd   = echo radio-c

[Interactive | Open Notepad]
param = check:0
tags  = gui
desc  = gui-tagged; skipped in silent/headless runs. Harmless.
cmd   = start notepad.exe

[Lifecycle | Explorer Restart Demo]
param = check:0
tags  = restart-explorer
desc  = restart-explorer tagged; would restart explorer.exe at end of a real run.
cmd   = echo explorer-restart-demo

[Lifecycle | Reboot Demo]
param = check:0
tags  = reboot
desc  = reboot tagged; silent runs print the reboot-required notice.
cmd   = echo reboot-demo

[Args | Robocopy List Only]
param = check:0
tags  = dev
desc  = Named txt/num args with placeholders; robocopy /L lists without copying.
arg.Source  = txt:C:\Windows
arg.Dest    = txt:C:\Windows-Backup
arg.Threads = num:4
cmd         = robocopy "{Source}" "{Dest}" /MT:{Threads} /L
