# Flood-test configuration: prints more lines than the Win32 posted-message queue limit.
# Used to verify the GUI log pump keeps up; harmless output only (echo).

[Stress | Massive Output]
param = check:1
tags  = common, stress
desc  = Prints ~12000 lines of text to stress the log pump. Harmless (echo only).
cmd   = for /L %i in (1,1,12000) do @echo line %i of the flood test
